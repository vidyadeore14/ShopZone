<!DOCTYPE html>
<html>
<head>
  <title>Payment - ShopZone</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <h2>Processing Payment...</h2>

  <script>
    const userDetails = JSON.parse(localStorage.getItem('userDetails'));
    const cart = JSON.parse(localStorage.getItem('cart')) || [];

    if (!userDetails || cart.length === 0) {
      alert("Missing user/cart details. Redirecting to checkout.");
      window.location.href = "checkout.html";
    }

    // ✅ Calculate total amount
    const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

    const options = {
      "key": "rzp_live_TMIZE5RYjjemaO", // ✅ Replace with your Live/Test Key
      "amount": totalAmount * 100, // Convert to paisa
      "currency": "INR",
      "name": "ShopZone",
      "description": "Order Payment",

      "handler": function (response) {
        alert("✅ Payment Successful!\nPayment ID: " + response.razorpay_payment_id);

        fetch("https://shopzone-backend-6qfu.onrender.com/api/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: userDetails.name,
            phone: userDetails.phone,
            address: userDetails.address
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.trackingId) {
            localStorage.setItem("trackingId", data.trackingId);
          }
          window.location.href = "order-confirmed.html";
        })
        .catch(err => {
          alert("❌ Payment done but order failed. Please contact support.");
          window.location.href = "index.html";
        });
      },

      "prefill": {
        "name": userDetails.name,
        "email": "test@example.com",
        "contact": userDetails.phone
      },
      "notes": {
        "address": userDetails.address
      },
      "theme": {
        "color": "#3399cc"
      }
    };

    const rzp = new Razorpay(options);
    rzp.open();
  </script>
</body>
</html>

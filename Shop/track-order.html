<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Order - ShopZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">ShopZone</a>
    </div>
  </nav>

  <div class="container mt-5 text-center">
    <h2>📦 Track Your Order</h2>
    <input type="text" id="trackInput" placeholder="Enter Tracking ID" class="form-control w-50 mx-auto mb-3">
    <button onclick="trackOrder()" class="btn btn-success">Track</button>
    <p id="statusOutput" class="mt-3 text-primary"></p>
  </div>

  <script>
    function trackOrder() {
      const id = document.getElementById('trackInput').value.trim();

      if (!id) {
        document.getElementById('statusOutput').innerText = "Please enter a valid Tracking ID.";
        return;
      }

      fetch(`/api/track?trackingId=${id}`)
        .then(res => res.json())
        .then(data => {
          if (data.status) {
            document.getElementById('statusOutput').innerText = "Current Status: " + data.status;
          } else {
            document.getElementById('statusOutput').innerText = "❌ Order not found!";
          }
        }).catch(err => {
          document.getElementById('statusOutput').innerText = "Server error. Please try again later.";
        });
    }
  </script>
</body>
</html>
